server {
    listen 80;
    listen [::]:80;
    server_name polaris-ai.work;

    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://__ORIGIN_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.polaris-ai.work;

    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    return 301 https://polaris-ai.work$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name polaris-ai.work;

    ssl_certificate /etc/letsencrypt/live/polaris-ai.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polaris-ai.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://__ORIGIN_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.polaris-ai.work;

    ssl_certificate /etc/letsencrypt/live/polaris-ai.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polaris-ai.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://polaris-ai.work$request_uri;
}

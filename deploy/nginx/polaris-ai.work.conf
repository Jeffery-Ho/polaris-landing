server {
    listen 80;
    listen [::]:80;
    server_name polaris-ai.work www.polaris-ai.work;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/polaris-landing/current;
        default_type text/plain;
    }

    location / {
        return 301 https://polaris-ai.work$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name polaris-ai.work;

    root /srv/polaris-landing/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/polaris-ai.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polaris-ai.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.polaris-ai.work;

    ssl_certificate /etc/letsencrypt/live/polaris-ai.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polaris-ai.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://polaris-ai.work$request_uri;
}

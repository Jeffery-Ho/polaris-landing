    <section class="analytics-consent" data-analytics-consent hidden role="dialog" aria-labelledby="analytics-consent-title" aria-describedby="analytics-consent-copy">

      <p class="analytics-consent-copy" id="analytics-consent-copy">Allow Google Analytics to measure only support-page interactions. You can change this anytime.</p>
      <div class="analytics-consent-actions">
        <button class="analytics-consent-button analytics-consent-button--allow" data-analytics-accept type="button">Allow analytics</button>
        <button class="analytics-consent-button" data-analytics-decline type="button">Not now</button>
      </div>
    </section>

    <script type="module">
      import { supportConfig } from "./support-config.js";
      import { liquidGlass } from "./vendor/liquid-glass-0.1.0.js";

      const video = document.querySelector("[data-support-video]");
      const videoThumbnail = document.querySelector("[data-video-thumbnail]");
      const placeholder = document.querySelector("[data-video-placeholder]");
      const videoPlayButton = document.querySelector("[data-video-play-button]");
      const paypalLink = document.querySelector("[data-paypal-link]");
      const analyticsConsent = document.querySelector("[data-analytics-consent]");
      const analyticsAccept = document.querySelector("[data-analytics-accept]");
      const analyticsDecline = document.querySelector("[data-analytics-decline]");
      const analyticsSettings = document.querySelector("[data-analytics-settings]");
      const analyticsConsentStorageKey = "polaris-landing-analytics-consent";
      let analyticsEnabled = false;
      let analyticsInitialized = false;

      function trackEvent(name, parameters) {
        if (analyticsEnabled && typeof window.gtag === "function") {
          window.gtag("event", name, parameters);
        }
      }

      function trackSupportEntry() {
        const query = new URLSearchParams(window.location.search);

        if (query.get("utm_source") === "polaris_extension" && query.get("utm_medium") === "support_entry") {
          trackEvent("support_entry_opened", { source: "polaris_extension" });
        }
      }

      function loadGoogleAnalytics() {
        const measurementId = supportConfig.googleAnalyticsMeasurementId;

        if (!measurementId || analyticsEnabled) {
          return;
        }

        if (!analyticsInitialized) {
          window.dataLayer = window.dataLayer || [];
          window.gtag = function gtag() {
            window.dataLayer.push(arguments);
          };
          window.gtag("js", new Date());
          window.gtag("config", measurementId, { send_page_view: false });

          const script = document.createElement("script");
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(measurementId)}`;
          document.head.appendChild(script);
          analyticsInitialized = true;
        } else {
          window.gtag("consent", "update", { analytics_storage: "granted" });
        }

        analyticsEnabled = true;
        trackSupportEntry();
      }

      function setAnalyticsConsent(value) {
        window.localStorage.setItem(analyticsConsentStorageKey, value);
        analyticsConsent.hidden = true;

        if (value === "granted") {
          loadGoogleAnalytics();
        } else {
          analyticsEnabled = false;

          if (analyticsInitialized && typeof window.gtag === "function") {
            window.gtag("consent", "update", { analytics_storage: "denied" });
          }
        }
      }

      const savedAnalyticsConsent = window.localStorage.getItem(analyticsConsentStorageKey);

      if (savedAnalyticsConsent === "granted") {
        loadGoogleAnalytics();
      } else if (savedAnalyticsConsent !== "denied") {
        analyticsConsent.hidden = false;
      }

      analyticsAccept.addEventListener("click", () => setAnalyticsConsent("granted"));
      analyticsDecline.addEventListener("click", () => setAnalyticsConsent("denied"));
      analyticsSettings.addEventListener("click", () => {
        analyticsConsent.hidden = false;
        analyticsAccept.focus();
      });

      const liquidGlassInstances = [
        liquidGlass(document.querySelector('[data-liquid-glass="header"]'), { scale: -88, chroma: 4, mapBlur: 7 }),
        liquidGlass(document.querySelector('[data-liquid-glass="play-button"]'), { scale: -62, chroma: 3.5, mapBlur: 6 }),
        liquidGlass(document.querySelector('[data-liquid-glass="paypal"]'), { scale: -76, chroma: 3.5, mapBlur: 7 })
      ];

      window.addEventListener("pagehide", () => {
        liquidGlassInstances.forEach((instance) => instance.destroy());
      }, { once: true });

      function startVideoPlayback() {
        const playback = video.play();

        if (playback) {
          playback.catch(() => {
            video.controls = true;
            videoPlayButton.hidden = false;
          });
        }
      }

      function isVideoFullyBuffered() {
        if (!Number.isFinite(video.duration) || video.duration <= 0 || video.buffered.length === 0) {
          return false;
        }

        let bufferedEnd = 0;

        for (let index = 0; index < video.buffered.length; index += 1) {
          if (video.buffered.start(index) > bufferedEnd + 0.1) {
            return false;
          }

          bufferedEnd = video.buffered.end(index);
        }

        return bufferedEnd >= video.duration - 0.1;
      }

      function revealFullyBufferedVideo() {
        if (!isVideoFullyBuffered() || !video.hidden) {
          return;
        }

        video.hidden = false;
        videoThumbnail.hidden = true;
        videoPlayButton.hidden = true;
        startVideoPlayback();
      }

      videoPlayButton.addEventListener("click", () => {
        trackEvent("video_play_button_clicked", { surface: "video_loading_overlay" });

        if (video.hidden) {
          return;
        }

        startVideoPlayback();
      });

      if (supportConfig.videoSource) {
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.src = supportConfig.videoSource;
        video.addEventListener("loadedmetadata", revealFullyBufferedVideo);
        video.addEventListener("progress", revealFullyBufferedVideo);
        video.addEventListener("canplaythrough", revealFullyBufferedVideo);
        video.addEventListener("playing", () => {
          placeholder.hidden = true;
          videoPlayButton.hidden = true;
        });
        video.addEventListener("waiting", () => {
          if (!video.hidden) {
            videoPlayButton.hidden = false;
          }
        });
        video.addEventListener("stalled", () => {
          videoPlayButton.hidden = false;
        });
        video.addEventListener("error", () => {
          videoPlayButton.hidden = false;
        });
        video.load();
      }

      if (supportConfig.paypalUrl) {
        paypalLink.href = supportConfig.paypalUrl;
        paypalLink.target = "_blank";
        paypalLink.rel = "noreferrer";
        paypalLink.removeAttribute("aria-disabled");
      }
    </script>
  </body>
</html>
